server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en cabeceras ni páginas de error
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend container
    # (las cabeceras de seguridad de la API las pone el propio backend con helmet)
    location /api/ {
        proxy_pass http://auth-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # IP real del cliente para que el límite de intentos del login funcione por usuario
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloquear archivos ocultos y carpetas de control de versiones (.git, .env, .hg, etc.).
    # Sin esto, el fallback del SPA devuelve index.html con código 200 para estas rutas
    # y un escáner las reporta como "archivo oculto encontrado".
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # SPA routing fallback
    location / {
        # --- Cabeceras de seguridad ---
        # CSP: solo se permite cargar código propio, los microfrontends de los demás
        # equipos (puertos 5174-5178) y las fuentes de Google Fonts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' http://localhost:5174 http://localhost:5175 http://localhost:5176 http://localhost:5177 http://localhost:5178; style-src 'self' https://fonts.googleapis.com http://localhost:5174 http://localhost:5175 http://localhost:5176 http://localhost:5177 http://localhost:5178; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:5174 http://localhost:5175 http://localhost:5176 http://localhost:5177 http://localhost:5178; connect-src 'self' http://localhost:4000 http://localhost:5174 http://localhost:5175 http://localhost:5176 http://localhost:5177 http://localhost:5178; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
